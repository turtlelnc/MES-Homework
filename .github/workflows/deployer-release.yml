name: Desktop deployer

# 构建 C++ 桌面版一键部署器（单文件、无外部运行时依赖）与应用运行时包。
# - push 到主分支/功能分支：构建各平台产物并上传 artifact
# - push 版本 tag（v*）：额外创建 GitHub Release 并附加全部资产
# 本地验收时可用 `gh run download <run-id>` 取回产物，再创建 draft Release。

on:
  push:
    branches: [main, 261024DSH02]
    tags: ["v*"]
  pull_request:
    paths:
      - "tools/deployer/**"
      - ".github/workflows/deployer-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deployer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployer-windows:
    name: Deployer Windows ${{ matrix.slug }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            slug: x64
            runnable: true
          - arch: Win32
            slug: x86
            runnable: true
          - arch: ARM64
            slug: arm64
            runnable: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/deployer -B tools/deployer/build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DMES_DEPLOYER_TESTING=ON
      - name: Build
        run: cmake --build tools/deployer/build --config Release --parallel
      - name: Unit tests and self-test
        if: matrix.runnable
        shell: pwsh
        run: |
          ctest --test-dir tools/deployer/build -C Release --output-on-failure
          $p = Start-Process -FilePath "tools/deployer/build/Release/mes-deployer.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "桌面部署器核心自检失败，退出码 $($p.ExitCode)" }
      - name: Collect single-file deployer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item tools/deployer/build/Release/mes-deployer.exe "release/mes-deployer-windows-${{ matrix.slug }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: deployer-windows-${{ matrix.slug }}
          path: release/mes-deployer-windows-${{ matrix.slug }}.exe

  deployer-linux-x64:
    name: Deployer Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xorg-dev
      - name: Configure and build
        run: |
          cmake -S tools/deployer -B tools/deployer/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMES_DEPLOYER_TESTING=ON
          cmake --build tools/deployer/build --parallel
      - name: Test
        run: |
          ctest --test-dir tools/deployer/build --output-on-failure
          ./tools/deployer/build/mes-deployer --self-test
          ./tools/deployer/build/mes-deployer --version
      - name: Collect
        run: |
          mkdir -p release
          cp tools/deployer/build/mes-deployer release/mes-deployer-linux-x64
          chmod +x release/mes-deployer-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: deployer-linux-x64
          path: release/mes-deployer-linux-x64

  deployer-linux-arm64:
    name: Deployer Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xorg-dev
      - name: Configure and build
        run: |
          cmake -S tools/deployer -B tools/deployer/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMES_DEPLOYER_TESTING=ON
          cmake --build tools/deployer/build --parallel
      - name: Test
        run: |
          ctest --test-dir tools/deployer/build --output-on-failure
          ./tools/deployer/build/mes-deployer --self-test
          ./tools/deployer/build/mes-deployer --version
      - name: Collect
        run: |
          mkdir -p release
          cp tools/deployer/build/mes-deployer release/mes-deployer-linux-arm64
          chmod +x release/mes-deployer-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: deployer-linux-arm64
          path: release/mes-deployer-linux-arm64

  deployer-linux-x86:
    name: Deployer Linux x86
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib g++-multilib \
            libx11-dev:i386 libxrandr-dev:i386 libxinerama-dev:i386 \
            libxcursor-dev:i386 libxi-dev:i386 libgl1-mesa-dev:i386 xorg-dev
      - name: Configure and build (glibc 2.35 i386)
        run: |
          cmake -S tools/deployer -B tools/deployer/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMES_DEPLOYER_TESTING=ON \
            -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
          cmake --build tools/deployer/build --parallel
      - name: Test
        run: |
          ctest --test-dir tools/deployer/build --output-on-failure
          ./tools/deployer/build/mes-deployer --self-test
          file tools/deployer/build/mes-deployer
      - name: Collect
        run: |
          mkdir -p release
          cp tools/deployer/build/mes-deployer release/mes-deployer-linux-x86
          chmod +x release/mes-deployer-linux-x86
      - uses: actions/upload-artifact@v4
        with:
          name: deployer-linux-x86
          path: release/mes-deployer-linux-x86

  deployer-macos-arm64:
    name: Deployer macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S tools/deployer -B tools/deployer/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMES_DEPLOYER_TESTING=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build tools/deployer/build --parallel
      - name: Test
        run: |
          ctest --test-dir tools/deployer/build --output-on-failure
          ./tools/deployer/build/mes-deployer --self-test
          ./tools/deployer/build/mes-deployer --version
      - name: Collect
        run: |
          mkdir -p release
          cp tools/deployer/build/mes-deployer release/mes-deployer-macos-arm64
          chmod +x release/mes-deployer-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: deployer-macos-arm64
          path: release/mes-deployer-macos-arm64

  app-bundle:
    name: App runtime ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            slug: windows-x64
            platform: windows
            arch: x64
          - os: windows-11-arm
            slug: windows-arm64
            platform: windows
            arch: arm64
          - os: ubuntu-22.04
            slug: linux-x64
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            slug: linux-arm64
            platform: linux
            arch: arm64
          - os: macos-14
            slug: macos-arm64
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install, build and prune to production dependencies
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Package app runtime bundle
        run: node tools/deployer/packaging/build-app-bundle.mjs --out release/mes-homework-app-${{ matrix.platform }}-${{ matrix.arch }}.zip --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.slug }}
          path: |
            release/mes-homework-app-${{ matrix.platform }}-${{ matrix.arch }}.zip
            release/mes-homework-app-${{ matrix.platform }}-${{ matrix.arch }}.zip.meta.json

  publish-draft:
    name: Publish draft pre-release (feature branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/261024DSH02'
    needs:
      - deployer-windows
      - deployer-linux-x64
      - deployer-linux-arm64
      - deployer-linux-x86
      - deployer-macos-arm64
      - app-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read release identity from source
        run: node tools/ops/release-identity.mjs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Build manifest and checksums
        run: |
          node tools/deployer/packaging/build-manifest.mjs --dir release
          rm -f release/*.meta.json release/*.sha256
          chmod +x release/mes-deployer-linux-* release/mes-deployer-macos-* || true
          ls -la release
      - name: Create or update draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${DEPLOYER_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${DEPLOYER_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft --prerelease \
              --target "${GITHUB_SHA}" \
              --title "桌面版无依赖一键部署器 ${DEPLOYER_VERSION} (build ${DEPLOYER_BUILD})" \
              --notes-file "docs/releases/${DEPLOYER_VERSION}.md"
          fi
          gh release upload "${DEPLOYER_VERSION}" release/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${DEPLOYER_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - deployer-windows
      - deployer-linux-x64
      - deployer-linux-arm64
      - deployer-linux-x86
      - deployer-macos-arm64
      - app-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read release identity from source
        run: node tools/ops/release-identity.mjs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Build manifest and checksums
        run: |
          node tools/deployer/packaging/build-manifest.mjs --dir release
          chmod +x release/mes-deployer-linux-* release/mes-deployer-macos-* || true
          ls -la release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Desktop deployer ${GITHUB_REF_NAME} (build ${DEPLOYER_BUILD})" \
            --notes "C++ 桌面版无依赖一键部署器：支持本地版/服务器版，单文件运行。资产包含 Windows/Linux/macOS 部署器与应用运行时包，校验值见 SHA256SUMS.txt。" \
            release/*
