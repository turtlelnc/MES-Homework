name: Cloud validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium real UI and backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:teaching
      - run: npm run build
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Real browser workflows with isolated fixtures and mock model
        run: npm run test:browser
      - name: Upload screenshots, traces and failure videos
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  # Native Windows launcher/MSI validation is provided by native-installers.yml.
